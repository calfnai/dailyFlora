<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Sign in to your DailyFlora garden." />
    <title>登录 DailyFlora</title>
    <link rel="stylesheet" href="../src/marketing.css" />
  </head>
  <body data-page="member" data-auth-mode="login">
    <div class="page-shell product-shell">
      <header class="site-header">
        <a class="brand" href="../" aria-label="DailyFlora home" data-i18n-aria="common.brandHome"><span class="brand-mark" aria-hidden="true"></span>DAILYFLORA</a>
        <nav class="site-nav" aria-label="站点导航"><a href="../" data-i18n="common.today">Today's bouquet</a><a href="../member/" data-i18n="common.member">My garden</a><a href="../signup/">注册</a><a href="../about/" data-i18n="common.about">About</a></nav>
      </header>
      <main class="product-section wrap auth-page">
        <section class="signup-intro">
          <div class="signup-copy">
            <p class="eyebrow">DailyFlora ID</p>
            <h1 class="display">欢迎回到花园。</h1>
            <p class="lead">在新设备登录后，继续查看同一份收藏、生成历史与个人花园。</p>
          </div>
          <article class="signup-card">
            <span class="card-step">Sign in</span>
            <h2>登录</h2>
            <p>还没有账户？<a href="../signup/">立即注册</a></p>
            <form class="signup-form" id="auth-form">
              <div class="field"><label for="auth-email">邮箱</label><input id="auth-email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required /></div>
              <div class="field"><label for="auth-password">密码</label><input id="auth-password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required /></div>
              <button class="button primary" type="submit">登录并打开花园 <span class="arrow" aria-hidden="true">→</span></button>
              <p class="account-form-switch"><a href="#forgot">忘记密码？</a></p>
            </form>
            <form class="signup-form" id="forgot-form" hidden>
              <div class="field"><label for="forgot-email">注册邮箱</label><input id="forgot-email" name="email" type="email" autocomplete="email" required /></div>
              <button class="button primary" type="submit">发送重置邮件</button>
              <p class="account-form-switch"><a href="#">返回登录</a></p>
            </form>
            <form class="signup-form" id="reset-form" hidden>
              <input id="reset-token" name="token" type="hidden" />
              <div class="field"><label for="reset-password">新密码</label><input id="reset-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required /></div>
              <div class="field"><label for="reset-password-confirm">确认新密码</label><input id="reset-password-confirm" name="passwordConfirm" type="password" autocomplete="new-password" minlength="8" maxlength="128" required /></div>
              <button class="button primary" type="submit">保存新密码并登录</button>
            </form>
            <p class="account-form-error" id="auth-status" role="status" aria-live="polite" hidden></p>
          </article>
        </section>
      </main>
      <footer class="site-footer"><div class="footer-main wrap"><p class="footer-statement">A flower you loved should have somewhere to stay.</p><nav class="footer-col"><strong>账户</strong><a href="../signup/">注册</a><a href="../member/">个人花园</a></nav><nav class="footer-col"><strong>系统</strong><a href="../legal/terms/">使用条款</a><a href="../legal/privacy/">隐私政策</a><a href="../legal/credits/">Credits</a></nav></div></footer>
    </div>
    <script src="../dailyflora-config.js"></script>
    <script type="module" src="../src/staticI18n.ts"></script>
    <script type="module" src="../src/authPage.ts"></script>
  </body>
</html>
