<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Create a DailyFlora account and sync your private garden across devices." />
    <title>注册 DailyFlora</title>
    <link rel="stylesheet" href="../src/marketing.css" />
  </head>
  <body data-page="member" data-auth-mode="signup">
    <div class="page-shell product-shell">
      <header class="site-header">
        <a class="brand" href="../" aria-label="DailyFlora home" data-i18n-aria="common.brandHome"><span class="brand-mark" aria-hidden="true"></span>DAILYFLORA</a>
        <nav class="site-nav" aria-label="站点导航"><a href="../" data-i18n="common.today">Today's bouquet</a><a href="../member/" data-i18n="common.member">My garden</a><a href="../login/">登录已有账户</a><a href="../about/" data-i18n="common.about">About</a></nav>
      </header>
      <main class="product-section wrap auth-page">
        <section class="signup-intro">
          <div class="signup-copy">
            <p class="eyebrow">DailyFlora ID</p>
            <h1 class="display">建立你的花园。</h1>
            <p class="lead">注册后，收藏、生成历史和个人花园会随账户跨设备同步。</p>
            <div class="signup-proof"><span>真实云端账户</span><span>私有花园记录</span><span>随时可以退出</span></div>
          </div>
          <article class="signup-card">
            <span class="card-step">Create account</span>
            <h2>注册</h2>
            <p>已经有账户？<a href="../login/">直接登录</a></p>
            <form class="signup-form" id="auth-form">
              <div class="field"><label for="auth-name">怎么称呼你</label><input id="auth-name" name="name" type="text" autocomplete="name" required /></div>
              <div class="field"><label for="auth-email">邮箱</label><input id="auth-email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required /></div>
              <div class="field"><label for="auth-password">密码</label><input id="auth-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="8–128 位" required /></div>
              <label class="consent registration-consent"><input name="termsAccepted" type="checkbox" required /><span>我已阅读并同意 <a href="../legal/terms/" target="_blank" rel="noopener">使用条款</a> 和 <a href="../legal/privacy/" target="_blank" rel="noopener">隐私政策</a>。</span></label>
              <button class="button primary" type="submit">创建账户 <span class="arrow" aria-hidden="true">→</span></button>
            </form>
            <p class="account-form-error" id="auth-status" role="status" aria-live="polite" hidden></p>
          </article>
        </section>
      </main>
      <footer class="site-footer"><div class="footer-main wrap"><p class="footer-statement">A flower you loved should have somewhere to stay.</p><nav class="footer-col"><strong>账户</strong><a href="../login/">登录</a><a href="../member/">个人花园</a></nav><nav class="footer-col"><strong>系统</strong><a href="../legal/terms/">使用条款</a><a href="../legal/privacy/">隐私政策</a><a href="../legal/credits/">Credits</a></nav></div></footer>
    </div>
    <script src="../dailyflora-config.js"></script>
    <script type="module" src="../src/staticI18n.ts"></script>
    <script type="module" src="../src/authPage.ts"></script>
  </body>
</html>
