<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="DailyFlora internal processing console." />
    <title>DailyFlora Admin</title>
    <script type="module" crossorigin src="../assets/admin-DNym9ReC.js"></script>
    <link rel="modulepreload" crossorigin href="../assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="modulepreload" crossorigin href="../assets/dailyfloraCloud-DRcOVg2w.js">
    <link rel="modulepreload" crossorigin href="../assets/accountHeader-CgO5qBiv.js">
    <link rel="stylesheet" crossorigin href="../assets/admin-Cy2I5ZE3.css">
    <link rel="stylesheet" crossorigin href="../assets/marketing-BMAbPgF8.css">
    <meta name="dailyflora-release" content="DF-20260815-0358-064d1cdc">
  </head>
  <body data-page="admin">
    <main class="admin-shell wrap">
      <header class="admin-header">
        <div>
          <p class="eyebrow">DailyFlora / 0.72 Beta / Internal</p>
          <h1>Beta 任务后台</h1>
          <p>只连接 <code>dailyflora-api-beta</code> 与 Beta 集合；不会读写 0.71 正式账户。</p>
        </div>
        <div class="admin-header-actions">
          <span class="admin-identity" id="admin-identity">正在读取身份…</span>
          <a class="button" href="../member/">返回个人花园</a>
          <button class="button" id="admin-logout" type="button">退出账户</button>
        </div>
      </header>

      <section class="admin-state garden-panel" id="admin-state" aria-live="polite">正在检查后台权限…</section>
      <section class="admin-content" id="admin-content" hidden>
        <div class="admin-runtime garden-panel" id="admin-runtime" aria-live="polite">正在检查 Beta API…</div>
        <div class="admin-metrics" id="admin-metrics"></div>
        <section class="garden-panel admin-panel">
          <div class="panel-row"><div><p class="eyebrow">Accounts</p><h2>账户</h2></div><button class="button" id="admin-refresh" type="button">刷新</button></div>
          <div class="admin-table-wrap"><table><thead><tr><th>昵称</th><th>邮箱</th><th>余额</th><th>创建时间</th><th>操作</th></tr></thead><tbody id="admin-users"></tbody></table></div>
        </section>
        <section class="garden-panel admin-panel">
          <div class="panel-row"><div><p class="eyebrow">Codex queue</p><h2>参考图处理任务</h2></div><div class="button-row"><button class="button primary" id="admin-process-queue" type="button">拉取并处理待生成任务</button><select id="admin-task-filter"><option value="">全部</option><option value="queued">queued</option><option value="processing">processing</option><option value="completed">completed</option><option value="failed">failed</option></select></div></div>
          <p class="muted" id="admin-worker-state">本机桥接器应监听 127.0.0.1:43172；凭证仅对本批任务短时有效。</p>
          <div class="admin-task-list" id="admin-tasks"></div>
        </section>
      </section>
    </main>
    <script src="../dailyflora-config.js"></script>
  </body>
</html>
